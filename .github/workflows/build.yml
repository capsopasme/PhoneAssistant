name: Build APK

# Builds the assistant for arm64-v8a: sherpa-onnx (with Qualcomm QNN) from source, then the APK.
# Run it from "Actions" -> "Build APK" -> "Run workflow", or push to main.
#
# Optional repository secrets for a stable signature (same as the fcitx5-android voice CI,
# you can reuse that keystore):
#   SIGN_KEY_BASE64  base64 of a .jks keystore
#   SIGN_KEY_ALIAS   key alias
#   SIGN_KEY_PWD     keystore / key password
# Without them the APK is signed with a throw-away debug key (next build can't update it).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108" "cmake;3.31.6"
          echo "ANDROID_NDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Cache sherpa-onnx build
        uses: actions/cache@v5
        with:
          path: |
            build/voice-native/sherpa-libs-*
            build/voice-native/qnn-libs-*
          key: voice-native-${{ hashFiles('voice/prepare-native.sh') }}

      - name: Build sherpa-onnx with QNN
        run: ./voice/prepare-native.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: phone-assistant-arm64-v8a
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
